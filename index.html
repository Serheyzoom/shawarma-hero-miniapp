<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Shawarma Hero</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background: #fff7e6;
        text-align: center;
        overflow-x: hidden;
    }

    .mascot {
        width: 240px;
        height: auto;
        margin-top: 20px;
        transition: transform 0.25s ease, filter 0.25s ease;
    }

    .mascot-pop {
        transform: scale(1.18);
    }

    .mascot-glow {
        filter: drop-shadow(0 0 15px #ffea00);
    }

    .effect {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 48px;
        font-weight: 900;
        color: #ff3d00;
        text-shadow: 3px 3px 0 #000;
        opacity: 0;
        animation: boom 0.6s ease-out forwards;
        pointer-events: none;
    }

    @keyframes boom {
        0% { opacity: 0; transform: translateX(-50%) scale(0.3); }
        50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
        100% { opacity: 0; transform: translateX(-50%) scale(0.4); }
    }

    .flash {
        position: fixed;
        inset: 0;
        background: rgba(255,255,0,0.4);
        animation: flashAnim 0.3s ease-out forwards;
        pointer-events: none;
    }

    @keyframes flashAnim {
        from { opacity: 1; }
        to { opacity: 0; }
    }

    .card {
        background: white;
        margin: 20px;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .progress {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin: 10px 0;
    }

    .stamp {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #ddd;
    }

    .stamp.active {
        background: #ffb300;
    }

    .stamp.pop {
        transform: scale(1.4);
        transition: 0.3s;
    }

    button {
        padding: 12px 20px;
        margin: 6px;
        font-size: 16px;
        border-radius: 10px;
        border: none;
        background: #ffb300;
        color: black;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 3px 0 #c27d00;
    }

    button:active {
        transform: scale(0.95);
    }

    .bubble {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffb300;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        animation: bubbleAnim 0.6s ease-out forwards;
    }

    @keyframes bubbleAnim {
        0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        50% { opacity: 1; }
        100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
</style>
</head>

<body>

<img class="mascot" id="mascot"
     src="https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/супер%E2%80%91героя.png?raw=true">

<div id="effect-container"></div>

<div class="card">
    <div id="clientName">Загрузка…</div>
    <div id="clientPhone"></div>

    <h3>Твои штампы</h3>
    <div class="progress" id="progress"></div>

    <h3>Баллы ⚡</h3>
    <div id="points">0</div>

    <h3>Кешбэк 🔥</h3>
    <div id="cashback">0</div>

    <h3>Твой QR‑код</h3>
    <img id="qr" src="">
</div>

<button onclick="loadClient()">Обновить карту</button>
<button onclick="addStamp()">БАМС! +1 штамп</button>
<button onclick="giveGift()">Получить подарок</button>

<script>
/* ------------------ НАСТРОЙКИ ------------------ */

const urlParams = new URLSearchParams(window.location.search);
const clientId = urlParams.get("id");

const API = "https://script.google.com/macros/s/AKfycbxaMdVg6A1S1y4aXND3wLZvO_Vz_Nc7TcDrDcrmvLYiPpIrarY-5l6lujOCHjadZjjRNA/exec";

/* Новые маскоты */
const MASCOT = {
    happy: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/радостного%20маскота.png?raw=true",
    surprised: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/Генерируй%20удивлённог.png?raw=true",
    angry: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/боевой%20маскот.png?raw=true",
    super: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/супер%E2%80%91героя.png?raw=true",
    stamp: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/тамп.png?raw=true"
};

const EFFECTS = ["WOW!", "POP!", "BOOM!", "ZAP!", "BANG!"];
const emotions = ["happy", "surprised", "angry", "super"];
let autoIndex = 0;

/* ------------------ ЭФФЕКТЫ ------------------ */

function showEffect() {
    const div = document.createElement("div");
    div.className = "effect";
    div.textContent = EFFECTS[Math.floor(Math.random() * EFFECTS.length)];
    document.getElementById("effect-container").appendChild(div);
    setTimeout(() => div.remove(), 600);
}

function popMascot() {
    const m = document.getElementById("mascot");
    m.classList.add("mascot-pop");
    setTimeout(() => m.classList.remove("mascot-pop"), 250);
}

function setMascot(emotion) {
    const m = document.getElementById("mascot");
    m.src = MASCOT[emotion];
    popMascot();
    showEffect();

    if (emotion === "super") m.classList.add("mascot-glow");
    else m.classList.remove("mascot-glow");
}

function flash() {
    const f = document.createElement("div");
    f.className = "flash";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 300);
}

/* ------------------ АВТОСМЕНА ЭМОЦИЙ ------------------ */

setInterval(() => {
    autoIndex = (autoIndex + 1) % emotions.length;
    setMascot(emotions[autoIndex]);
}, 4000);

document.getElementById("mascot").onclick = () => {
    autoIndex = (autoIndex + 1) % emotions.length;
    setMascot(emotions[autoIndex]);
};

/* ------------------ ВСПЫШКИ ------------------ */

function bamEffect() {
    flash();
    setMascot("angry");
    if (navigator.vibrate) navigator.vibrate(80);
    showBubble("БАМС! +1 штамп");
}

function giftEffect() {
    flash();
    setMascot("super");
    if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
    showBubble("ПЫЩ! Подарок!");
}

/* ------------------ UI ------------------ */

function showBubble(text) {
    const div = document.createElement("div");
    div.className = "bubble";
    div.textContent = text;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 650);
}

function disableButtons(state) {
    document.querySelectorAll("button").forEach(btn => {
        btn.disabled = state;
        btn.style.opacity = state ? "0.5" : "1";
    });
}

/* ------------------ API ------------------ */

async function loadClient() {
    disableButtons(true);

    try {
        const res = await fetch(`${API}?action=getClient&client_id=${clientId}`);
        const data = await res.json();

        disableButtons(false);
        renderClient(data);
    } catch {
        disableButtons(false);
        alert("Ошибка загрузки данных");
    }
}

function renderClient(data) {
    if (data.error) {
        document.body.innerHTML = `
            <div style="padding:40px; text-align:center; font-size:22px;">
                <b>Клиент не найден</b><br><br>
                Проверь QR‑код или ID
            </div>`;
        return;
    }

    document.getElementById("clientName").innerText = data.name;
    document.getElementById("clientPhone").innerText = data.phone;

    const progress = document.getElementById("progress");
    const oldStamps = progress.querySelectorAll(".stamp.active").length || 0;

    progress.innerHTML = "";
    for (let i = 0; i < 10; i++) {
        const div = document.createElement("div");
        div.className = "stamp" + (i < data.stamps ? " active" : "");
        progress.appendChild(div);
    }

    if (data.stamps > oldStamps) {
        const stamps = progress.querySelectorAll(".stamp");
        const idx = data.stamps - 1;
        if (stamps[idx]) {
            stamps[idx].classList.add("pop");
            setTimeout(() => stamps[idx].classList.remove("pop"), 400);
        }
    }

    document.getElementById("points").innerText = data.points;
    document.getElementById("cashback").innerText = Number(data.cashback).toFixed(2);
    document.getElementById("qr").src = data.qr_code;

    updateMascot(data.stamps);
}

function updateMascot(stamps) {
    if (stamps >= 10) setMascot("super");
    else if (stamps >= 7) setMascot("angry");
    else if (stamps >= 3) setMascot("happy");
    else setMascot("surprised");
}

async function addStamp() {
    disableButtons(true);

    try {
        await fetch(`${API}?action=addStamp&client_id=${clientId}`);
        bamEffect();
        disableButtons(false);
        loadClient();
    } catch {
        disableButtons(false);
        alert("Ошибка при добавлении штампа");
    }
}

async function giveGift() {
    disableButtons(true);

    try {
        await fetch(`${API}?action=giveGift&client_id=${clientId}`);
        giftEffect();
        disableButtons(false);
        loadClient();
    } catch {
        disableButtons(false);
        alert("Ошибка при выдаче подарка");
    }
}

loadClient();
</script>

</body>
</html>
