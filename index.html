<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шаурма‑Герой</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #1A1A1A;
        font-family: 'Comic Sans MS', sans-serif;
        color: white;
        text-align: center;
    }

    .header {
        padding: 20px;
        background: radial-gradient(circle, #FFB300, #FF4D00);
        color: black;
        font-size: 26px;
        font-weight: bold;
        border-bottom: 5px solid black;
        text-shadow: 2px 2px 0px white;
    }

    .mascot {
        width: 180px;
        margin: 20px auto;
        filter: drop-shadow(0 0 10px #FFB300);
        transition: transform 0.2s;
    }

    .card {
        background: #fff;
        color: black;
        margin: 20px;
        padding: 20px;
        border-radius: 15px;
        border: 4px solid black;
        font-size: 20px;
    }

    .progress {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-top: 15px;
    }

    .stamp {
        width: 28px;
        height: 28px;
        background-size: cover;
        background-image: url('https://i.imgur.com/8tqgZ8B.png');
        opacity: 0.25;
        transition: 0.2s;
        transform: scale(0.9);
    }

    .stamp.active {
        opacity: 1;
        filter: drop-shadow(0 0 6px #FF4D00);
        transform: scale(1);
    }

    .stamp.pop {
        animation: popStamp 0.35s ease-out;
    }

    @keyframes popStamp {
        0% { transform: scale(0.2); opacity: 0; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    .btn-cloud {
        background: white;
        color: black;
        border: 4px solid black;
        border-radius: 40px;
        padding: 15px;
        margin: 10px;
        font-size: 20px;
        font-weight: bold;
        width: 80%;
        cursor: pointer;
        box-shadow: 4px 4px 0 black;
    }

    .btn-burst {
        background: #FFD400;
        color: black;
        border: 4px solid black;
        padding: 15px;
        margin: 10px;
        font-size: 22px;
        font-weight: bold;
        width: 80%;
        cursor: pointer;
        transform: skew(-8deg);
        box-shadow: 4px 4px 0 black;
    }

    #qr {
        margin-top: 15px;
        width: 180px;
        border: 4px solid black;
    }

    .flash {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, rgba(255,255,0,0.7), transparent);
        pointer-events: none;
        animation: flashAnim 0.3s ease-out;
        z-index: 9998;
    }

    .flash-gift {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,215,0,0.7));
        pointer-events: none;
        animation: flashGiftAnim 0.45s ease-out;
        z-index: 9998;
    }

    @keyframes flashAnim {
        from { opacity: 1; }
        to { opacity: 0; }
    }

    @keyframes flashGiftAnim {
        0% { opacity: 0; }
        30% { opacity: 1; }
        100% { opacity: 0; }
    }

    .btn-burst.bam {
        animation: bamShake 0.4s ease-out;
    }

    @keyframes bamShake {
        0% { transform: skew(-8deg) translateX(0); }
        25% { transform: skew(-8deg) translateX(-4px); }
        50% { transform: skew(-8deg) translateX(4px); }
        75% { transform: skew(-8deg) translateX(-2px); }
        100% { transform: skew(-8deg) translateX(0); }
    }

    .mascot-wow {
        animation: mascotWow 0.5s ease-out;
    }

    @keyframes mascotWow {
        0% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.08) rotate(-3deg); }
        100% { transform: scale(1) rotate(0deg); }
    }

    .bubble {
        position: fixed;
        left: 50%;
        top: 20%;
        transform: translateX(-50%);
        background: #fff;
        color: #000;
        border: 4px solid #000;
        border-radius: 30px;
        padding: 10px 20px;
        font-weight: bold;
        font-size: 22px;
        box-shadow: 4px 4px 0 #000;
        z-index: 10000;
        animation: bubbleUp 0.6s ease-out forwards;
    }

    @keyframes bubbleUp {
        0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
        40% { opacity: 1; transform: translate(-50%, -5px) scale(1.05); }
        100% { opacity: 0; transform: translate(-50%, -25px) scale(1); }
    }
</style>
</head>

<body>

<div id="loader" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  z-index: 9999;
  display: none;
">
  Загружаем вкусняшки...
</div>

<div class="header">ШАУРМА‑ГЕРОЙ</div>

<img class="mascot" id="mascot" src="https://copilot.microsoft.com/th/id/BCO.468a48d9-8965-41b7-96a2-66f3534c2a72.png">

<div class="card">
    <div id="clientName">Загрузка…</div>
    <div id="clientPhone"></div>

    <h3>Твои штампы</h3>
    <div class="progress" id="progress"></div>

    <h3>Баллы ⚡</h3>
    <div id="points">0</div>

    <h3>Кешбэк 🔥</h3>
    <div id="cashback">0</div>

    <h3>Твой QR‑код</h3>
    <img id="qr" src="">
</div>

<button class="btn-cloud" onclick="loadClient()">Обновить карту</button>
<button class="btn-burst" onclick="addStamp()">БАМС! +1 штамп</button>
<button class="btn-burst" onclick="giveGift()">Получить подарок</button>

<script>
const urlParams = new URLSearchParams(window.location.search);
const clientId = urlParams.get("id");
const API = "https://script.google.com/macros/s/AKfycbxaMdVg6A1S1y4aXND3wLZvO_Vz_Nc7TcDrDcrmvLYiPpIrarY-5l6lujOCHjadZjjRNA/exec";

const MASCOT_HAPPY = "https://copilot.microsoft.com/th/id/BCO.468a48d9-8965-41b7-96a2-66f3534c2a72.png";
const MASCOT_SURPRISED = "https://copilot.microsoft.com/th/id/BCO.3f7a8438-052b-40d9-8330-7571ab09af9d.png";
const MASCOT_ANGRY = "https://copilot.microsoft.com/th/id/BCO.e166c558-8602-4b89-a468-8bf0e177a249.png";
const MASCOT_SUPER = "https://copilot.microsoft.com/th/id/BCO.a9439df7-4b7a-401d-9c9d-5e8f35887a62.png";

function showLoader() {
  document.getElementById("loader").style.display = "flex";
}

function hideLoader() {
  document.getElementById("loader").style.display = "none";
}

function disableButtons(state) {
  document.querySelectorAll("button").forEach(btn => {
    btn.disabled = state;
    btn.style.opacity = state ? "0.5" : "1";
  });
}

function showBubble(text) {
  const div = document.createElement("div");
  div.className = "bubble";
  div.textContent = text;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 650);
}

function bamEffect() {
  const flash = document.createElement("div");
  flash.className = "flash";
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 300);

  const btn = document.querySelector('.btn-burst:nth-of-type(1)');
  if (btn) {
    btn.classList.add("bam");
    setTimeout(() => btn.classList.remove("bam"), 400);
  }

  const mascot = document.getElementById("mascot");
  if (mascot) {
    mascot.classList.add("mascot-wow");
    setTimeout(() => mascot.classList.remove("mascot-wow"), 500);
  }

  if (navigator.vibrate) {
    navigator.vibrate(80);
  }

  showBubble("БАМС! +1 штамп");
}

function giftEffect() {
  const flash = document.createElement("div");
  flash.className = "flash-gift";
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 450);

  const mascot = document.getElementById("mascot");
  if (mascot) {
    const prev = mascot.src;
    mascot.src = MASCOT_SUPER;
    setTimeout(() => { mascot.src = prev; }, 800);
  }

  if (navigator.vibrate) {
    navigator.vibrate([80, 60, 80]);
  }

  showBubble("ПЫЩ! Подарок!");
}

function updateMascot(stamps) {
  const mascot = document.getElementById("mascot");
  if (!mascot) return;

  if (stamps >= 10) {
    mascot.src = MASCOT_SUPER;
    showBubble("Герой дня!");
  } else if (stamps >= 7) {
    mascot.src = MASCOT_ANGRY;
  } else if (stamps >= 3) {
    mascot.src = MASCOT_HAPPY;
  } else {
    mascot.src = MASCOT_SURPRISED;
  }
}

async function loadClient() {
  showLoader();
  disableButtons(true);

  try {
    const res = await fetch(`${API}?action=getClient&client_id=${clientId}`);
    const data = await res.json();

    hideLoader();
    disableButtons(false);

    renderClient(data);
  } catch (e) {
    hideLoader();
    disableButtons(false);
    alert("Ошибка загрузки данных");
  }
}

function renderClient(data) {
  if (data.error) {
    document.body.innerHTML = `
      <div style="padding:40px; text-align:center; font-size:22px;">
        <b>Клиент не найден</b><br><br>
        Проверь QR‑код или ID
      </div>
    `;
    return;
  }

  document.getElementById("clientName").innerText = data.name;
  document.getElementById("clientPhone").innerText = data.phone;

  const progress = document.getElementById("progress");
  const oldStamps = progress.querySelectorAll(".stamp.active").length || 0;

  progress.innerHTML = "";
  for (let i = 0; i < 10; i++) {
    const div = document.createElement("div");
    let cls = "stamp";
    if (i < data.stamps) cls += " active";
    div.className = cls;
    progress.appendChild(div);
  }

  if (data.stamps > oldStamps) {
    const stamps = progress.querySelectorAll(".stamp");
    const idx = data.stamps - 1;
    if (stamps[idx]) {
      stamps[idx].classList.add("pop");
      setTimeout(() => stamps[idx].classList.remove("pop"), 400);
    }
  }

  document.getElementById("points").innerText = data.points;
  document.getElementById("cashback").innerText = Number(data.cashback).toFixed(2);
  document.getElementById("qr").src = data.qr_code;

  updateMascot(data.stamps);
}

async function addStamp() {
  showLoader();
  disableButtons(true);

  try {
    const res = await fetch(`${API}?action=addStamp&client_id=${clientId}`);
    await res.json();

    bamEffect();

    hideLoader();
    disableButtons(false);
    loadClient();
  } catch (e) {
    hideLoader();
    disableButtons(false);
    alert("Ошибка при добавлении штампа");
  }
}

async function giveGift() {
  showLoader();
  disableButtons(true);

  try {
    const res = await fetch(`${API}?action=giveGift&client_id=${clientId}`);
    await res.json();

    giftEffect();

    hideLoader();
    disableButtons(false);
    loadClient();
  } catch (e) {
    hideLoader();
    disableButtons(false);
    alert("Ошибка при выдаче подарка");
  }
}

loadClient();
</script>

</body>
</html>
