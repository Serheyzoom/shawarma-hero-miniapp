<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Shawarma Hero</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background: #fff7e6;
        text-align: center;
        overflow-x: hidden;
    }

    .mascot {
        width: 240px;
        height: auto;
        margin-top: 20px;
        transition: transform 0.25s ease, filter 0.25s ease;
    }

    .mascot-pop {
        transform: scale(1.18);
    }

    .mascot-glow {
        filter: drop-shadow(0 0 15px #ffea00);
    }

    .mascot-transform {
        animation: transformAnim 0.45s ease-out;
    }

    @keyframes transformAnim {
        0% { transform: scale(1) rotate(0deg); opacity: 1; }
        30% { transform: scale(0.6) rotate(-10deg); opacity: 0.3; }
        60% { transform: scale(1.3) rotate(8deg); opacity: 0.8; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .effect {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 48px;
        font-weight: 900;
        color: #ff3d00;
        text-shadow: 3px 3px 0 #000;
        opacity: 0;
        animation: boom 0.6s ease-out forwards;
        pointer-events: none;
    }

    @keyframes boom {
        0% { opacity: 0; transform: translateX(-50%) scale(0.3); }
        50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
        100% { opacity: 0; transform: translateX(-50%) scale(0.4); }
    }

    .lightning {
        position: absolute;
        width: 260px;
        height: 260px;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: url('https://i.imgur.com/8Kq7Z0F.png') center/contain no-repeat;
        animation: lightningAnim 0.5s ease-out forwards;
        pointer-events: none;
    }

    @keyframes lightningAnim {
        0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
        50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
        100% { opacity: 0; transform: translateX(-50%) scale(0.8); }
    }

    .explosion {
        position: absolute;
        width: 300px;
        height: 300px;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        background: url('https://i.imgur.com/8z6h7zF.png') center/contain no-repeat;
        animation: explosionAnim 0.6s ease-out forwards;
        pointer-events: none;
    }

    @keyframes explosionAnim {
        0% { opacity: 0; transform: translateX(-50%) scale(0.3); }
        40% { opacity: 1; transform: translateX(-50%) scale(1.4); }
        100% { opacity: 0; transform: translateX(-50%) scale(0.8); }
    }

    .card {
        background: white;
        margin: 20px;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .progress {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin: 10px 0;
    }

    .stamp {
        width: 28px;
        height: 28px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.25;
    }

    .stamp.active {
        opacity: 1;
        background-image: url("https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/тамп.png?raw=true");
    }

    .stamp.pop {
        transform: scale(1.4);
        transition: 0.3s;
    }

    button {
        padding: 12px 20px;
        margin: 6px;
        font-size: 16px;
        border-radius: 10px;
        border: none;
        background: #ffb300;
        color: black;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 3px 0 #c27d00;
    }

    button:active {
        transform: scale(0.95);
    }

    .bubble {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: #ffb300;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        animation: bubbleAnim 0.6s ease-out forwards;
    }

    @keyframes bubbleAnim {
        0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        50% { opacity: 1; }
        100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    .flash {
        position: fixed;
        inset: 0;
        background: rgba(255,255,0,0.4);
        animation: flashAnim 0.3s ease-out forwards;
        pointer-events: none;
    }

    @keyframes flashAnim {
        from { opacity: 1; }
        to { opacity: 0; }
    }

    .error-effect {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 42px;
        font-weight: 900;
        color: #ff0000;
        text-shadow: 3px 3px 0 #000;
        opacity: 0;
        animation: errorBoom 0.7s ease-out forwards;
        pointer-events: none;
    }

    @keyframes errorBoom {
        0% { opacity: 0; transform: translateX(-50%) scale(0.3); }
        40% { opacity: 1; transform: translateX(-50%) scale(1.3); }
        100% { opacity: 0; transform: translateX(-50%) scale(0.4); }
    }
</style>
</head>

<body>

<img class="mascot" id="mascot"
     src="https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/супер%E2%80%91героя.png?raw=true">

<div id="effect-container"></div>

<div class="card">
    <div id="clientName">Загрузка…</div>
    <div id="clientPhone"></div>

    <h3>Твои штампы</h3>
    <div class="progress" id="progress"></div>

    <h3>Баллы ⚡</h3>
    <div id="points">0</div>

    <h3>Кешбэк 🔥</h3>
    <div id="cashback">0</div>

    <h3>Твой QR‑код</h3>
    <img id="qr" src="">
</div>

<button onclick="loadClient()">Обновить карту</button>
<button onclick="addStamp()">БАМС! +1 штамп</button>
<button onclick="giveGift()">Получить подарок</button>

<script>
/* ------------------ НАСТРОЙКИ ------------------ */

const urlParams = new URLSearchParams(window.location.search);
const clientId = urlParams.get("id");

const API = "https://script.google.com/macros/s/AKfycbwybLZ3uvUy4yWGKv20FPUOu2AmXafvZ3i4pjbU3ftQuVOQBmWBL8ZIWzsaxG3ayCdINg/exec";

const MASCOT = {
    happy: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/радостного%20маскота.png?raw=true",
    surprised: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/Генерируй%20удивлённог.png?raw=true",
    angry: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/боевой%20маскот.png?raw=true",
    super: "https://github.com/Serheyzoom/shawarma-hero-miniapp/blob/main/супер%E2%80%91героя.png?raw=true"
};

const EFFECTS = ["WOW!", "POP!", "BOOM!", "ZAP!", "BANG!"];

/* ------------------ ЭФФЕКТЫ ------------------ */

function showEffect() {
    const div = document.createElement("div");
    div.className = "effect";
    div.textContent = EFFECTS[Math.floor(Math.random() * EFFECTS.length)];
    document.getElementById("effect-container").appendChild(div);
    setTimeout(() => div.remove(), 600);
}

function showErrorEffect() {
    const div = document.createElement("div");
    div.className = "error-effect";
    div.textContent = "❌ BOOM! Не хватает штампов";
    document.getElementById("effect-container").appendChild(div);
    setTimeout(() => div.remove(), 700);
}

function popMascot() {
    const m = document.getElementById("mascot");
    m.classList.add("mascot-pop");
    setTimeout(() => m.classList.remove("mascot-pop"), 250);
}

function setMascot(emotion) {
    const m = document.getElementById("mascot");

    m.classList.add("mascot-transform");
    setTimeout(() => m.classList.remove("mascot-transform"), 450);

    m.src = MASCOT[emotion];
    popMascot();
    showEffect();

    if (emotion === "super") {
        m.classList.add("mascot-glow");

        const bolt = document.createElement("div");
        bolt.className = "lightning";
        document.body.appendChild(bolt);
        setTimeout(() => bolt.remove(), 500);
    } else {
        m.classList.remove("mascot-glow");
    }
}

function flash() {
    const f = document.createElement("div");
    f.className = "flash";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 300);
}

/* ------------------ ВСПЫШКИ ------------------ */

function bamEffect() {
    flash();
    showBubble("БАМС! +1 штамп");
}

function giftEffect() {
    flash();

    const boom = document.createElement("div");
    boom.className = "explosion";
    document.body.appendChild(boom);
    setTimeout(() => boom.remove(), 600);

    showBubble("LEVEL UP! 🔥");
}

/* ------------------ UI ------------------ */

function showBubble(text) {
    const div = document.createElement("div");
    div.className = "bubble";
    div.textContent = text;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 650);
}

function disableButtons(state) {
    document.querySelectorAll("button").forEach(btn => {
        btn.disabled = state;
        btn.style.opacity = state ? "0.5" : "1";
    });
}

/* ------------------ API ------------------ */

async function loadClient() {
    disableButtons(true);

    try {
        const res = await fetch(`${API}?action=getClient&client_id=${clientId}`);
        const data = await res.json();

        disableButtons(false);
        renderClient(data);
    } catch {
        disableButtons(false);
        alert("Ошибка загрузки данных");
    }
}

function renderClient(data) {
    if (data.error) {
        document.body.innerHTML = `
            <div style="padding:40px; text-align:center; font-size:22px;">
                <b>Клиент не найден</b><br><br>
                Проверь QR‑код или ID
            </div>`;
        return;
    }

    document.getElementById("clientName").innerText = data.name;
    document.getElementById("clientPhone").innerText = data.phone;

    const progress = document.getElementById("progress");
    progress.innerHTML = "";

    for (let i = 0; i < data.stamps; i++) {
        const div = document.createElement("div");
        div.className = "stamp active";
        progress.appendChild(div);
    }

    document.getElementById("points").innerText = data.points;
    document.getElementById("cashback").innerText = Number(data.cashback).toFixed(2);
    document.getElementById("qr").src = data.qr_code;

    updateMascot(data.stamps);
}

/* ------------------ ЛОГИКА МАСКОТА ------------------ */

function updateMascot(stamps) {
    if (stamps >= 10) {
        setMascot("super");
    }
    else if (stamps >= 7) {
        setMascot("angry");
    }
    else if (stamps >= 3) {
        setMascot("happy");
    }
    else {
        setMascot("surprised");
    }
}

/* ------------------ АНИМАЦИЯ СПИСАНИЯ 10 ШТАМПОВ ------------------ */

function animateStampRemoval() {
    const stamps = document.querySelectorAll(".stamp.active");
    const count = stamps.length;

    const toRemove = Array.from(stamps).slice(count - 10, count);

    toRemove.forEach((stamp, i) => {
        setTimeout(() => {
            stamp.classList.add("pop");
            stamp.style.opacity = "0";
            setTimeout(() => stamp.remove(), 300);
        }, i * 80);
    });
}

/* ------------------ ДЕЙСТВИЯ ------------------ */

async function addStamp() {
    disableButtons(true);

    try {
        await fetch(`${API}?action=addStamp&client_id=${clientId}`);
        bamEffect();
        disableButtons(false);
        loadClient();
    } catch {
        disableButtons(false);
        alert("Ошибка при добавлении штампа");
    }
}

async function giveGift() {
    disableButtons(true);

    try {
        const res = await fetch(`${API}?action=getClient&client_id=${clientId}`);
        const data = await res.json();

        if (data.stamps < 10) {
            disableButtons(false);
            showErrorEffect();
            return;
        }

        animateStampRemoval();
        giftEffect();

        await fetch(`${API}?action=remove10&client_id=${clientId}`);

        setTimeout(() => {
            disableButtons(false);
            loadClient();
        }, 1200);

    } catch {
        disableButtons(false);
        alert("Ошибка при выдаче подарка");
    }
}

loadClient();
</script>

</body>
</html>
