<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шаурма‑Герой</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #1A1A1A;
        font-family: 'Comic Sans MS', sans-serif;
        color: white;
        text-align: center;
    }

    .header {
        padding: 20px;
        background: radial-gradient(circle, #FFB300, #FF4D00);
        color: black;
        font-size: 26px;
        font-weight: bold;
        border-bottom: 5px solid black;
        text-shadow: 2px 2px 0px white;
    }

    .mascot {
        width: 180px;
        margin: 20px auto;
        filter: drop-shadow(0 0 10px #FFB300);
    }

    .card {
        background: #fff;
        color: black;
        margin: 20px;
        padding: 20px;
        border-radius: 15px;
        border: 4px solid black;
        font-size: 20px;
    }

    .progress {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-top: 15px;
    }

    .stamp {
        width: 28px;
        height: 28px;
        background-size: cover;
        background-image: url('https://i.imgur.com/8tqgZ8B.png');
        opacity: 0.25;
        transition: 0.3s;
    }

    .stamp.active {
        opacity: 1;
        filter: drop-shadow(0 0 6px #FF4D00);
    }

    .btn-cloud {
        background: white;
        color: black;
        border: 4px solid black;
        border-radius: 40px;
        padding: 15px;
        margin: 10px;
        font-size: 20px;
        font-weight: bold;
        width: 80%;
        cursor: pointer;
        box-shadow: 4px 4px 0 black;
    }

    .btn-burst {
        background: #FFD400;
        color: black;
        border: 4px solid black;
        padding: 15px;
        margin: 10px;
        font-size: 22px;
        font-weight: bold;
        width: 80%;
        cursor: pointer;
        transform: skew(-8deg);
        box-shadow: 4px 4px 0 black;
    }

    #qr {
        margin-top: 15px;
        width: 180px;
        border: 4px solid black;
    }
</style>
</head>

<body>

<!-- ЛОАДЕР -->
<div id="loader" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  z-index: 9999;
  display: none;
">
  Загружаем вкусняшки...
</div>

<div class="header">ШАУРМА‑ГЕРОЙ</div>

<img class="mascot" id="mascot" src="https://i.imgur.com/8Q2xg5S.png">

<div class="card">
    <div id="clientName">Загрузка…</div>
    <div id="clientPhone"></div>

    <h3>Твои штампы</h3>
    <div class="progress" id="progress"></div>

    <h3>Баллы ⚡</h3>
    <div id="points">0</div>

    <h3>Кешбэк 🔥</h3>
    <div id="cashback">0</div>

    <h3>Твой QR‑код</h3>
    <img id="qr" src="">
</div>

<button class="btn-cloud" onclick="loadClient()">Обновить карту</button>
<button class="btn-burst" onclick="addStamp()">БАМС! +1 штамп</button>
<button class="btn-burst" onclick="giveGift()">Получить подарок</button>

<script>

const urlParams = new URLSearchParams(window.location.search);
const clientId = urlParams.get("id");
const API = "https://script.google.com/macros/s/AKfycbxaMdVg6A1S1y4aXND3wLZvO_Vz_Nc7TcDrDcrmvLYiPpIrarY-5l6lujOCHjadZjjRNA/exec";

// ---------------- ЛОАДЕР ----------------

function showLoader() {
  document.getElementById("loader").style.display = "flex";
}

function hideLoader() {
  document.getElementById("loader").style.display = "none";
}

// ---------------- БЛОКИРОВКА КНОПОК ----------------

function disableButtons(state) {
  document.querySelectorAll("button").forEach(btn => {
    btn.disabled = state;
    btn.style.opacity = state ? "0.5" : "1";
  });
}

// ---------------- ЗАГРУЗКА КЛИЕНТА ----------------

async function loadClient() {
  showLoader();
  disableButtons(true);

  try {
    const res = await fetch(`${API}?action=getClient&client_id=${clientId}`);
    const data = await res.json();

    hideLoader();
    disableButtons(false);

    renderClient(data);
  } catch (e) {
    hideLoader();
    disableButtons(false);
    alert("Ошибка загрузки данных");
  }
}

// ---------------- ОТОБРАЖЕНИЕ ДАННЫХ ----------------

function renderClient(data) {

  if (data.error) {
    document.body.innerHTML = `
      <div style="padding:40px; text-align:center; font-size:22px;">
        <b>Клиент не найден</b><br><br>
        Проверь QR‑код или ID
      </div>
    `;
    return;
  }

  document.getElementById("clientName").innerText = data.name;
  document.getElementById("clientPhone").innerText = data.phone;

  // ШТАМПЫ
  const progress = document.getElementById("progress");
  progress.innerHTML = "";
  for (let i = 0; i < 10; i++) {
    const div = document.createElement("div");
    div.className = "stamp" + (i < data.stamps ? " active" : "");
    progress.appendChild(div);
  }

  document.getElementById("points").innerText = data.points;
  document.getElementById("cashback").innerText = data.cashback.toFixed(2);
  document.getElementById("qr").src = data.qr_code;
}

// ---------------- ДЕЙСТВИЯ ----------------

async function addStamp() {
  showLoader();
  disableButtons(true);

  try {
    const res = await fetch(`${API}?action=addStamp&client_id=${clientId}`);
    await res.json();

    hideLoader();
    disableButtons(false);
    loadClient();
  } catch (e) {
    hideLoader();
    disableButtons(false);
    alert("Ошибка при добавлении штампа");
  }
}

async function giveGift() {
  showLoader();
  disableButtons(true);

  try {
    const res = await fetch(`${API}?action=giveGift&client_id=${clientId}`);
    await res.json();

    hideLoader();
    disableButtons(false);
    loadClient();
  } catch (e) {
    hideLoader();
    disableButtons(false);
    alert("Ошибка при выдаче подарка");
  }
}

</script>

</body>
</html>
